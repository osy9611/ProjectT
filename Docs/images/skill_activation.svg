<text x="340.0" y="127" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">BlockedTags 확인</text>
<text x="340.0" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">하나라도 보유하면 무시</text>
